<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS TikTok Live Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Tampilan Khusus OBS: Transparan & Aesthetic */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; 
            background: transparent; /* Penting untuk OBS */
            overflow: hidden; /* Hilangkan scrollbar di OBS */
        }
        
        #btn-container {
            margin-bottom: 20px;
        }
        button { 
            padding: 12px 24px; 
            background: #ff0050; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background: #cc0040; }
        
        #chatBox { 
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 600px;
            overflow-y: hidden;
            justify-content: flex-end; /* Chat baru muncul dari bawah */
        }
        
        .chat-msg { 
            background: rgba(0, 0, 0, 0.7); 
            color: white;
            padding: 10px 15px; 
            border-radius: 10px;
            border-left: 4px solid #00f2fe;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
            font-size: 16px;
            text-shadow: 1px 1px 2px black;
        }
        
        .chat-msg strong { color: #00f2fe; }
        .sys-msg { background: rgba(255, 165, 0, 0.8); border-left-color: #ff4500; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <div id="btn-container">
        <button id="startTts">Aktifkan Suara di OBS (Klik Saya!)</button>
    </div>

    <div id="chatBox"></div>

    <script>
        const socket = io();
        const chatBox = document.getElementById('chatBox');
        const btnTts = document.getElementById('startTts');
        
        let ttsEnabled = false;
        let audioQueue = [];
        let isPlaying = false;

        // Ambil param URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get('username');

        if (targetUsername) {
            socket.emit('set-username', targetUsername);
        } else {
            addMessage("Sistem", "URL tidak valid. Gunakan ?username=namaakun", true);
        }

        // Aktifkan Audio lewat Interaksi
        btnTts.addEventListener('click', () => {
            ttsEnabled = true;
            btnTts.style.display = 'none'; // Sembunyikan tombol setelah diklik agar tidak mengganggu layar stream
            addMessage("Sistem", "🔊 Suara Google TTS Berhasil Diaktifkan!", true);
        });

        // Pemutar Antrean Audio
        function playNextAudio() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                return;
            }

            isPlaying = true;
            const audioData = audioQueue.shift();

            const audio = new Audio(audioData);
            audio.onended = playNextAudio;
            audio.onerror = () => {
                console.error("Gagal memutar audio base64");
                playNextAudio();
            };

            audio.play().catch(e => {
                console.error("Autoplay OBS terblokir. Sudah klik Interact?", e);
                playNextAudio();
            });
        }

        function addMessage(user, text, isSystem = false) {
            const div = document.createElement('div');
            div.className = 'chat-msg' + (isSystem ? ' sys-msg' : '');
            div.innerHTML = `<strong>${user}:</strong> ${text}`;
            chatBox.appendChild(div);

            // Auto hapus chat lama agar tidak memberatkan OBS (maksimal tampil 10 chat terakhir)
            if (chatBox.children.length > 10) {
                chatBox.removeChild(chatBox.firstChild);
            }
        }

        socket.on('sys-message', (msg) => {
            addMessage("Sistem", msg, true);
        });

        socket.on('chat', (data) => {
            // 1. Tampilkan di layar OBS
            addMessage(data.username, data.comment);

            // 2. Mainkan suara jika sudah diaktifkan dan ada data audio dari server
            if (ttsEnabled && data.audioData) {
                audioQueue.push(data.audioData);
                if (!isPlaying) {
                    playNextAudio();
                }
            }
        });
    </script>
</body>
</html>
